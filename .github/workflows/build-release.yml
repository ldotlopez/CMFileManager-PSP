name: Build and release

on:
  push:
    branches: [next]
    tags: ['v*']
  pull_request:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: apk add --no-cache build-base git bash cmake zip

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p dist/CMFileManager
          cp app/EBOOT.PBP \
             fs_driver/fs_driver.prx \
             audio_driver/audio_driver.prx \
             display_driver/display_driver.prx \
             dist/CMFileManager/
          (cd dist && zip -r ../CMFileManager-PSP.zip CMFileManager)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMFileManager-PSP
          path: dist/CMFileManager/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CMFileManager-PSP.zip
          generate_release_notes: true
